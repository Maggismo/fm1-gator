# SPDX-License-Identifier: GPL-3.0-only
# Build a GATOR release (BUILDING.md, "Releasing").
#   push of a tag vX.Y  -> build both packages (tools/release.py), test them, create or update the GitHub release vX.Y
#                          with the packages, SHA256SUMS and the licences, then start pages.yml
#   workflow_dispatch   -> build only; the release folder is a workflow artifact
# On ubuntu (x86-64) tools/build.py runs the JieLi toolchain natively, no Docker.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1 (X.Y, one digit each, or X.Y-suffix). Builds an artifact; no release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"
  PILLOW_VERSION: "11.1.0"
  NODE_VERSION: "22"
  CC: clang
  CXX: clang++

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          if [[ ! "$v" =~ ^[0-9]\.[0-9](-[A-Za-z0-9]+)?$ ]]; then
            echo "::error::version '$v' is not X.Y or X.Y-suffix with one digit each (the identity is FM-1_9XY); tags are vX.Y"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          {
            echo "VERSION=$v"
            echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Python packages
        run: python3 -m pip install --disable-pip-version-check "Pillow==$PILLOW_VERSION"

      - name: Cache the JieLi toolchain
        id: toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.jieli
          key: jieli-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/get_toolchain.sh') }}

      - name: Fetch the JieLi toolchain (pkgman.jieliapp.com)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh "$HOME/.jieli"

      - name: Build (tools/release.py)
        run: |
          set -euo pipefail
          ulimit -n 8192 || true
          python3 tools/release.py "$VERSION"
          rel="build/release-$VERSION"
          for f in "gator-$VERSION.fwsc" "gator-$VERSION-48k.fwsc" SHA256SUMS LICENSE LICENSING.md; do
            if [ ! -s "$rel/$f" ]; then
              echo "::error::$rel/$f is missing"
              exit 1
            fi
          done
          (cd "$rel" && sha256sum -c SHA256SUMS && zip -q -r LICENSES.zip LICENSES)
          ls -l "$rel"

      - name: Test (host simulator, installer protocol, site)
        run: |
          set -euo pipefail
          rel="build/release-$VERSION"
          for fs in 44 48; do
            python3 tools/sim.py --fs "$fs"
            python3 tools/sim.py --fs "$fs" host/models.sim
          done
          python3 tools/sim.py --test
          node web/test_web.mjs "$rel/gator-$VERSION.fwsc"
          node web/test_web.mjs "$rel/gator-$VERSION-48k.fwsc"
          python3 web/make_site.py --release "$rel"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gator-${{ env.VERSION }}
          path: build/release-${{ env.VERSION }}/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write                 # create the release and upload its assets
      actions: write                  # start pages.yml (a release made with GITHUB_TOKEN starts no workflow itself)
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/releases
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gator-${{ needs.build.outputs.version }}
          path: release

      - name: Collect the release assets
        run: |
          set -euo pipefail
          mkdir assets
          for f in "gator-$VERSION.fwsc" "gator-$VERSION-48k.fwsc" SHA256SUMS LICENSE LICENSING.md LICENSES.zip; do
            cp "release/$f" assets/
          done
          ls -l assets

      - name: Release notes (docs/releases/<version>.md, then the install text)
        run: |
          set -euo pipefail
          {
            if [ -f "docs/releases/$VERSION.md" ]; then cat "docs/releases/$VERSION.md"; echo; echo "---"; echo; fi
            sed "s/@VERSION@/$VERSION/g" <<'EOT'
          GATOR @VERSION@ for the M-VAVE FM-1.

          Install from the browser at https://npi3pak.github.io/fm1-gator/ (Chrome or Edge, the FM-1 connected by USB), or with the command-line installer: `python3 tools/fm1_install.py gator-@VERSION@.fwsc`.

          `gator-@VERSION@.fwsc` runs at 44.1 kHz (recommended), `gator-@VERSION@-48k.fwsc` at 48 kHz. `SHA256SUMS` lists both. Each package holds three JieLi AC79 SDK files (Apache-2.0); `LICENSE`, `LICENSING.md` and `LICENSES.zip` carry every licence.

          **Installing custom firmware is at your own risk.** GATOR is provided as is, without any warranty.
          EOT
          } > release-body.md

      - name: Create or update the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: GATOR ${{ needs.build.outputs.version }}
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
          body_path: release-body.md

      - name: Publish the site (pages.yml)
        if: ${{ !contains(env.VERSION, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # run from the default branch (the github-pages environment allows it), the site built from the tag
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
              -f version="$VERSION" -f ref="$GITHUB_REF_NAME"
          echo "::notice::pages.yml started for $VERSION (Actions tab); the site follows in a minute or two"
